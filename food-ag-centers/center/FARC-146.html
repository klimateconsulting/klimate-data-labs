<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>U.S. food and agriculture research centers</title>
    <meta name="description" content="Map of U.S. food and agriculture research centers by value chain stage, with details, websites and sources for each center." />
    <meta name="theme-color" content="#1a4832" />
    <link rel="icon" type="image/png" sizes="32x32" href="/food-ag-centers/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/food-ag-centers/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/food-ag-centers/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="U.S. food and agriculture research centers" />
    <meta property="og:title" content="U.S. food and agriculture research centers" />
    <meta property="og:description" content="Map of U.S. food and agriculture research centers by value chain stage, with details, websites and sources for each center." />
    <meta property="og:url" content="https://data.klimateconsulting.com/food-ag-centers/" />
    <meta property="og:image" content="https://data.klimateconsulting.com/food-ag-centers/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Headline and the twelve value chain stage colors" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="U.S. food and agriculture research centers" />
    <meta name="twitter:description" content="Map of U.S. food and agriculture research centers by value chain stage, with details, websites and sources for each center." />
    <meta name="twitter:image" content="https://data.klimateconsulting.com/food-ag-centers/og.png" />
    <script type="module" crossorigin src="/food-ag-centers/assets/main-BPnJNDLM.js"></script>
    <link rel="modulepreload" crossorigin href="/food-ag-centers/assets/data-6_l-Mc1w.js">
    <link rel="stylesheet" crossorigin href="/food-ag-centers/assets/data-BKrZHO8K.css">
    <link rel="stylesheet" crossorigin href="/food-ag-centers/assets/main-BSHmSy40.css">
  </head>
  <body>
    <header class="topbar">
      <h1 class="headline">U.S. food and agriculture research centers</h1>
      <div class="search-wrap">
        <label for="search" class="visually-hidden">Search by name, acronym, parent organization, description, research topics or tags</label>
        <input type="search" id="search" class="search" placeholder="Search centers" autocomplete="off" spellcheck="false" />
        <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>&times;</button>
      </div>
      <div class="topbar-controls">
        <button type="button" id="fit-lower48" class="btn map-only">Lower 48</button>
        <button type="button" id="fit-all" class="btn map-only">All points</button>
        <button type="button" id="export-open" class="btn" hidden>Export</button>
        <a href="/about" id="about-link" class="btn btn-link about-link">About the data</a>
      </div>
    </header>
    <nav class="filter-bar" aria-label="View and filters">
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" class="view-btn" data-view="map" aria-pressed="true">Map</button>
        <button type="button" class="view-btn" data-view="table" aria-pressed="false">Table</button>
        <button type="button" class="view-btn" data-view="landscape" aria-pressed="false">Landscape</button>
      </div>
      <div id="filter-bar" class="filter-controls"></div>
    </nav>
    <section id="stage-legend" class="legend" aria-label="Primary stage"></section>
    <main class="map-wrap">
      <div id="map" class="map"></div>
      <section id="table-view" class="table-view" aria-label="Table of research centers" hidden>
        <div class="table-toolbar">
          <span id="table-count" class="table-count"></span>
          <button type="button" id="export-csv" class="btn btn-small">Export CSV</button>
        </div>
      </section>
      <div class="landscape-wrap" id="view-landscape" hidden></div>
    </main>
    <dialog id="export" class="about" aria-labelledby="export-title">
      <div class="about-header">
        <h2 id="export-title" class="about-title">Export the landscape</h2>
        <button type="button" id="export-close" class="panel-close" aria-label="Close">&times;</button>
      </div>
      <p id="export-size"></p>
      <p id="export-status" class="export-status" aria-live="polite"></p>
      <div class="export-actions">
        <button type="button" id="export-png" class="btn">PNG at 2x</button>
        <button type="button" id="export-svg" class="btn">SVG</button>
      </div>
    </dialog>
  </body>
</html>
